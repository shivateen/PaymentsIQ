<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaymentsIQ · Supplier Claim Validation</title>
  <meta name="description" content="PaymentsIQ — AI validation of supplier payment claims. Benchmark analysis and aberration detection to catch over-billing before the payment run." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F7901D'/%3E%3Ctext x='16' y='22' font-family='Inter,Arial' font-size='15' font-weight='700' fill='%23181D27' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/theme.css" />
</head>
<body>

  <div class="app">

    <!-- ------------------------------------------------ Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="brandmark">P</span>
        <div class="stack">
          <span class="t-h6 name">PaymentsIQ</span>
          <span class="t-caption sub">Finance AI Platform</span>
        </div>
      </div>

      <nav class="sidebar__nav" aria-label="Primary"><!-- rendered by app.js --></nav>

      <div class="sidebar__foot">
        <span class="t-overline" style="color:var(--gray-500)">Agents</span>
        <div class="agentpill"><span class="pulse"></span>Retrieval Agent</div>
        <div class="agentpill"><span class="pulse"></span>Validation Agent</div>
        <div class="agentpill"><span class="pulse"></span>Communication Agent</div>
        <div class="divider" style="background:var(--gray-800);margin:12px 0"></div>
        <span class="t-caption" style="color:var(--gray-500)">Powered by Tiger Analytics</span>
      </div>
    </aside>

    <!-- ------------------------------------------------ Main -->
    <div class="main">
      <header class="topbar">
        <div class="topbar__title"><!-- rendered by app.js --></div>
        <span class="topbar__spacer"></span>

        <div class="searchbox">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#74777D" stroke-width="1.8"
               stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" placeholder="Search claims, vendors, POs" aria-label="Search" />
        </div>

        <button class="btn btn--ghost btn--sm" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/>
          </svg>
        </button>

        <div class="row gap-3">
          <span class="avatar">FS</span>
          <div class="stack">
            <span class="t-subtitle2 tone-primary">Finance Shared Services</span>
            <span class="t-caption">Senior Finance Analyst</span>
          </div>
        </div>
      </header>

      <main class="content"><!-- rendered by app.js --></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div class="toasts" aria-live="polite"></div>

  <script src="./assets/data.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
